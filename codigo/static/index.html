<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enshrouded Save Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --bg2:#10161d; --panel:#141c25; --panel2:#1a2430; --line:#243241;
  --text:#e6edf3; --muted:#8b9bab; --accent:#4fd1c5; --accent2:#7c5cff; --warn:#f6ad55; --bad:#fc6d6d; --good:#5ee39a;
  --radius:14px; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 10% -10%,#16263a 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#231a3f 0,transparent 55%),var(--bg);
  color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:rgba(16,22,29,.85);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:18px;box-shadow:0 6px 20px -6px var(--accent)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.sec-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 4px 6px}
.files,.nav{display:flex;flex-direction:column;gap:4px}
.fbtn,.nbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 11px;cursor:pointer;color:var(--muted)}
.fbtn:hover,.nbtn:hover{background:var(--panel);color:var(--text)}
.fbtn.active,.nbtn.active{background:var(--panel2);border-color:var(--line);color:var(--text)}
.fbtn span:last-child{font-size:11px;color:var(--muted)}
.nbtn .ico{width:20px;text-align:center}
.nbtn{justify-content:flex-start}
.nbtn[disabled]{opacity:.35;pointer-events:none}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:22px;margin:0;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.good .dot{background:var(--good)} .chip.bad .dot{background:var(--bad)} .chip.warn .dot{background:var(--warn)}
.chip.bad{color:#ffd0d0;border-color:#5a2a2a} .chip.warn{color:#ffe2bd;border-color:#5a4426}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:#36506a;background:#1f2b39}
.btn.primary{background:linear-gradient(135deg,var(--accent),#3ba7d6);border:0;color:#04131a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#ffb3b3;border-color:#5a2a2a}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:linear-gradient(180deg,rgba(26,36,48,.9),rgba(20,28,37,.9));border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card p.hint{color:var(--muted);margin:4px 0 0;font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
input.in,select.in{background:#0d131a;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;width:100%}
input.in:focus,select.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,209,197,.15)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:12px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{position:relative;background:#0f161e;border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;min-height:92px;transition:.12s;display:flex;flex-direction:column;gap:4px}
.slot:hover{border-color:var(--accent);transform:translateY(-1px)}
.slot .n{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted)}
.slot .nm{font-weight:600;font-size:13px;padding-right:22px;word-break:break-word}
.slot .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.slot .qty{margin-top:auto;font-weight:700;font-size:18px}
.bar{height:4px;border-radius:4px;background:#22303e;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent))}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:#22303e;color:var(--muted);align-self:flex-start}
.slot .pic{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:340px;overflow:auto}
.witem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:#0f161e;cursor:pointer;font-size:11.5px;text-align:center}
.witem:hover,.witem.sel{border-color:var(--accent)}
.witem img{width:48px;height:48px;object-fit:contain}
.preview{display:flex;align-items:center;gap:12px}
.preview img{width:64px;height:64px;object-fit:contain;background:#0f161e;border:1px solid var(--line);border-radius:12px;padding:6px}
.ty{font-size:10.5px;padding:1px 7px;border-radius:6px;align-self:flex-start;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.slot{border-left:3px solid var(--c,var(--line))}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters .tab{font-size:12px;padding:5px 11px}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;background:#0f161e;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.info span:nth-child(odd){color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chips .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.slot.empty{border-style:dashed;color:var(--muted);align-items:center;justify-content:center;font-size:12px;cursor:default}
.slot.empty:hover{transform:none;border-color:var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--panel2);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}
.mono{font-family:var(--mono)}
.hex{font-family:var(--mono);font-size:12.5px;line-height:1.75;overflow:auto;background:#0b1117;border:1px solid var(--line);border-radius:12px;padding:12px}
.hex .ln{color:#4d6175;margin-right:14px}
.hex .ascii{color:#5f7a92;margin-left:14px}
.hex .b{cursor:pointer;padding:0 1px;border-radius:3px}
.hex .b:hover{background:#26394b}
.hex .b.sel{background:var(--accent);color:#04131a}
.hex .z{color:#3a4a5a}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:rgba(246,173,85,.08);border-color:#5a4426;color:#ffe2bd}
.banner.bad{background:rgba(252,109,109,.08);border-color:#5a2a2a;color:#ffd0d0}
.banner.info{background:rgba(79,209,197,.07);border-color:#1f4a49;color:#c7f3ee}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:.22s;padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.drawer h3{margin:0;font-size:17px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:50;transition:.25s;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:#5a2a2a;color:#ffd0d0}.toast.ok{border-color:#1f4a49;color:#c7f3ee}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.steps li{margin:4px 0}.steps b{color:var(--text)}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .big{font-size:44px}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills .tag{font-family:var(--mono);font-size:11px;padding:3px 8px}
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:8px 14px;padding:11px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.opt:last-child{border-bottom:0}
.opt .tx{flex:1 1 210px;min-width:0}.opt .tx b{display:block;font-weight:600;font-size:13.5px}.opt .tx span{color:var(--muted);font-size:12px}
.opt select.in,.opt input.in{width:auto;min-width:190px}
.opt input[type=range]{width:160px;accent-color:var(--accent)}
.opt .val{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:46px;text-align:right}
.sw{position:relative;width:44px;height:24px;flex:none;cursor:pointer}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:24px;background:#2a3846;transition:.15s;pointer-events:none}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#cfd8e0;transition:.15s}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{left:23px;background:#04131a}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--accent);color:#04131a}
.keybtn{font-family:var(--mono);min-width:120px}
.keybtn.wait{border-color:var(--accent);color:var(--accent)}
.opts.off{opacity:.45;pointer-events:none}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:18px 16px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">⚔</div><div>Enshrouded<small>Save Editor</small></div></div>
    <div>
      <div class="sec-title">Arquivos</div>
      <div class="files" id="files"></div>
    </div>
    <div>
      <div class="sec-title">Ferramentas</div>
      <div class="nav" id="nav">
        <button class="nbtn" data-v="char"><span class="ico">🧙</span>Personagem</button>
        <button class="nbtn" data-v="inv"><span class="ico">🎒</span>Inventário</button>
        <button class="nbtn" data-v="scan"><span class="ico">🔎</span>Caçador de valores</button>
        <button class="nbtn" data-v="hex"><span class="ico">🧬</span>Blocos (hex)</button>
        <button class="nbtn" data-v="bak"><span class="ico">🛟</span>Backups</button>
        <button class="nbtn" data-v="map"><span class="ico">🧭</span>Minimapa</button>
      </div>
    </div>
    <div style="margin-top:auto;font-size:11.5px;color:var(--muted)" id="dir"></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title">Carregando…</h1>
      <span class="chip" id="gameChip"><span class="dot"></span><span>—</span></span>
      <span class="chip" id="dirtyChip" style="display:none"><span class="dot"></span>Alterações não salvas</span>
      <button class="btn" id="reloadBtn" title="Recarregar do disco">↻ Recarregar</button>
      <button class="btn primary" id="saveBtn" disabled>💾 Salvar no jogo</button>
    </div>
    <div id="banners"></div>
    <div id="view"></div>
  </main>
</div>
<div class="drawer-bg" id="drawerBg"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API_VERSION = 9;
const NO_FILE_VIEWS = ['bak', 'map'];  // abas que funcionam sem save aberto
let ST = null, VIEW = location.hash === '#minimapa' ? 'map' : 'char', CH = null, HEX = {block:null, offset:0, sel:null}, SCAN = null, INVTAB = 'backpack';

async function call(path, body){
  const r = await fetch(path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || 'Erro');
  return j;
}
function toast(msg, kind='ok'){ const t=$('#toast'); t.className='toast show '+kind; t.textContent=msg; clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',3200); }
async function act(fn){ try{ const r = await fn(); await refresh(); return r; }catch(e){ toast(e.message,'err'); } }

async function refresh(){
  ST = await call('/api/state');
  const f = $('#files');
  f.innerHTML = ST.files.map(x => `<button class="fbtn ${ST.open===x.name?'active':''}" data-f="${esc(x.name)}"><span>${fileIcon(x.name)} ${esc(x.name)}</span><span>${fmtSize(x.size)}</span></button>`).join('') || '<div style="color:var(--muted);font-size:12px;padding:6px">Nenhum save encontrado</div>';
  f.querySelectorAll('.fbtn').forEach(b => b.onclick = () => openFile(b.dataset.f));
  $('#dir').innerHTML = ST.save_dir ? `📁 ${esc(ST.save_dir)}` : 'Pasta de saves não encontrada';
  const g = $('#gameChip');
  const GS = {closed:['good','Jogo fechado'], menu:['bad','Jogo aberto no menu — feche para salvar'], playing:['bad','Jogo aberto — feche para salvar']}[ST.game_state] || ['bad','—'];
  g.className = 'chip ' + GS[0];
  g.lastElementChild.textContent = GS[1];
  const d = $('#dirtyChip'); d.style.display = ST.dirty ? '' : 'none'; d.className = 'chip warn';
  $('#saveBtn').disabled = !ST.dirty || ST.game_state !== 'closed';
  const isChar = ST.info && ST.info.blocks.some(b => b.name === 'player_character');
  document.querySelectorAll('.nbtn').forEach(b => {
    b.classList.toggle('active', b.dataset.v === VIEW);
    b.disabled = !ST.open && !NO_FILE_VIEWS.includes(b.dataset.v) || (!isChar && (b.dataset.v==='char'||b.dataset.v==='inv'));
  });
  let bn = '';
  if(ST.api_version !== API_VERSION) bn += `<div class="banner bad">⛔ <div>Uma versão <b>antiga</b> do editor ainda está aberta e respondendo. Feche <b>todas</b> as janelas pretas do editor e abra o <b>Iniciar Editor.bat</b> de novo.</div></div>`;
  if(ST.changed_on_disk) bn += `<div class="banner warn">⚠️ <div>O jogo gravou este arquivo depois que você abriu. Clique em <b>Recarregar</b> antes de editar, senão as alterações não podem ser salvas.</div></div>`;
  if(ST.game_state !== 'closed' && VIEW !== 'map') bn += `<div class="banner bad">⛔ <div>O jogo está <b>aberto</b>. Pode preparar as mudanças, mas para <b>salvar</b> é preciso <b>fechar o jogo</b>: com ele aberto, mesmo no menu principal, a Steam rejeita o arquivo editado e o jogo grava o antigo por cima. Depois de fechar, clique em <b>Recarregar</b>, refaça as mudanças se precisar e salve.</div></div>`;
  $('#banners').innerHTML = bn;
  if(!ST.open && !NO_FILE_VIEWS.includes(VIEW)){ VIEW='none'; }
  $('#title').textContent = ({char:'Personagem',inv:'Inventário',scan:'Caçador de valores',hex:'Blocos do save',bak:'Backups',map:'Minimapa',none:'Escolha um arquivo'})[VIEW];
  await render();
}
const fileIcon = n => n.startsWith('character') ? '🧙' : n.startsWith('world') ? '🌍' : '⚙️';
const fmtSize = n => n > 1e6 ? (n/1e6).toFixed(1)+' MB' : n > 1e3 ? (n/1e3).toFixed(1)+' KB' : n+' B';

async function openFile(name){
  if(ST.dirty && !confirm('Há alterações não salvas. Abrir outro arquivo vai descartá-las. Continuar?')) return;
  await act(() => call('/api/open', {file:name}));
  const isChar = ST.info.blocks.some(b => b.name === 'player_character');
  VIEW = isChar ? (VIEW==='none'||NO_FILE_VIEWS.includes(VIEW) ? 'char' : VIEW) : 'hex';
  if(!isChar && (VIEW==='char'||VIEW==='inv')) VIEW='hex';
  HEX = {block:null, offset:0, sel:null}; SCAN = null;
  refresh();
}

async function render(){
  const v = $('#view');
  if(VIEW === 'none'){ v.innerHTML = `<div class="empty-state"><div class="big">🗝️</div><p>Escolha um arquivo à esquerda.<br><b>character0.ksd</b> é o seu personagem; <b>world0.ksd</b> é o mundo.</p></div>`; return; }
  if(VIEW === 'char' || VIEW === 'inv'){ try{ CH = await call('/api/character'); }catch(e){ v.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; return; } CH.db = CH.db || {}; CH.skilldb = CH.skilldb || {}; await loadInfo(Object.entries(CH.labels).filter(([h]) => !CH.db[h]).map(([,n]) => n)); }
  if(VIEW === 'char') return renderChar(v);
  if(VIEW === 'inv') return renderInv(v);
  if(VIEW === 'scan') return renderScan(v);
  if(VIEW === 'hex') return renderHex(v);
  if(VIEW === 'bak') return renderBak(v);
  if(VIEW === 'map') return renderMap(v);
}

/* ---------- Personagem ---------- */
function renderChar(v){
  v.innerHTML = `
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat"><span>Nome</span><b style="font-size:22px">${esc(CH.name)}</b></div>
    <div class="card stat"><span>Nível</span><b>${CH.level}</b></div>
    <div class="card stat"><span>Experiência</span><b>${CH.xp.toLocaleString('pt-BR')}</b></div>
    <div class="card stat"><span>Habilidades aprendidas</span><b>${CH.skills.length}</b></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card">
      <h2>✏️ Editar personagem</h2>
      <div class="grid" style="gap:12px">
        <label class="f">Nome<input class="in" id="cName" value="${esc(CH.name)}" maxlength="32"></label>
        <div class="row">
          <label class="f">Nível<input class="in" id="cLevel" type="number" min="1" max="100" value="${CH.level}"></label>
          <label class="f">XP<input class="in" id="cXp" type="number" min="0" value="${CH.xp}"></label>
        </div>
        <div><button class="btn primary" id="cApply">Aplicar</button></div>
        <p class="hint">Os pontos de talento vêm do nível. Subir o nível costuma liberar pontos extras quando o jogo recalcula. Comece com +1 ou +2 níveis e teste no jogo antes de ir além.</p>
      </div>
    </div>
    <div class="card">
      <h2>🌟 Pontos de talento</h2>
      <p class="hint" style="margin-bottom:10px">O save não guarda um campo "pontos livres" óbvio. Há duas formas de conseguir mais:</p>
      <ol class="steps">
        <li><b>Subir o nível</b> aqui ao lado (o mais simples).</li>
        <li>Usar o <b>Caçador de valores</b> para achar o campo exato: procure o número de pontos que o jogo mostra, gaste 1 ponto no jogo, saia para o menu e procure o novo número. O que sobrar é o campo.</li>
      </ol>
      <div style="margin-top:12px"><button class="btn" onclick="go('scan')">Abrir Caçador de valores →</button></div>
    </div>
    <div class="card">
      <h2>📜 Habilidades aprendidas <span class="tag">${CH.skills.length}</span></h2>
      <div class="skills">${CH.skills.map(s => { const k = CH.skilldb[s.hash]; return `<span class="tag" style="font-family:inherit;font-size:12px" title="${esc(k ? k.desc : s.hash)}">${esc(k ? k.pt : s.hash)}</span>`; }).join('') || '<span class="hint">Nenhuma</span>'}</div>
      <p class="hint" style="margin-top:10px">Passe o mouse numa habilidade para ver a descrição.</p>
    </div>
  </div>`;
  $('#cApply').onclick = () => act(() => call('/api/character/update', {name:$('#cName').value.trim(), level:+$('#cLevel').value, xp:+$('#cXp').value})).then(r => r && toast('Alterações aplicadas. Clique em "Salvar no jogo".'));
}

/* ---------- Inventário ---------- */
let INFO = {}, FILTER = 'Todos', DBX = {};
const TYPES = {
  'Arma':['⚔️','#ff7a7a'], 'Armadura':['🛡️','#7aa8ff'], 'Escudo':['🛡️','#6f8fd8'], 'Munição':['🏹','#ffb36b'],
  'Comida':['🍖','#7ee08a'], 'Consumível':['🧪','#c58bff'], 'Feitiço':['✨','#a78bfa'], 'Acessório':['💍','#f5d76e'],
  'Ferramenta':['⛏️','#9fb4c8'], 'Gema / Runa':['💎','#4fd1c5'], 'Material':['🪨','#c8a27a'], 'Construção':['🧱','#b08968'],
  'Projeto':['📜','#e0c080'], 'Colecionável':['🏺','#d9a0ff'], 'Aparência':['🎨','#ff9ad5'], 'Ração animal':['🌾','#a8d672'],
  'Instrumento':['🎵','#7fd6ff'], 'Moeda':['🪙','#f5d76e'], 'Desconhecido':['❔','#8b9bab'], 'Sem nome':['🏷️','#5f7183'],
};
const RARITY = {Common:['Comum','#b8c4d0'], Uncommon:['Incomum','#5ee39a'], Rare:['Raro','#5aa9ff'], Epic:['Épico','#c58bff'], Legendary:['Lendário','#ffb36b']};
const typeIcon = t => (TYPES[t]||['📦'])[0];
const typeColor = t => (TYPES[t]||[0,'#8b9bab'])[1];
const dbOf = h => (CH && CH.db[h]) || DBX[h];
const itemName = h => CH.labels[h] || (dbOf(h)||{}).pt || 'Item ' + h.slice(0,4).toUpperCase();
const imgName = h => (dbOf(h)||{}).en || CH.labels[h] || '';
const itemType = it => { const d = dbOf(it.hash); if(d) return d.type; const n = CH.labels[it.hash]; if(!n) return 'Sem nome'; const i = INFO[n]; return i ? i.type : 'Desconhecido'; };
const rarityChip = r => r && RARITY[r] ? `<span class="tag" style="color:${RARITY[r][1]}">${RARITY[r][0]}</span>` : '';
const typeChip = (t, sub) => `<span class="ty" style="--c:${typeColor(t)}">${typeIcon(t)} ${esc(sub || t)}</span>`;
const imgUrl = name => '/img/' + encodeURIComponent(name);
async function loadInfo(titles){
  const need = [...new Set(titles)].filter(t => t && !INFO[t]);
  if(!need.length) return;
  try{ Object.assign(INFO, (await call('/api/wiki/info', {titles:need})).info); }catch(e){ toast('Wiki indisponível: '+e.message, 'err'); }
}

function renderInv(v){
  if(!CH.inventory_ok){ v.innerHTML = `<div class="banner bad">Não consegui decodificar o inventário deste save (${esc(CH.inventory_error)}). Use a aba Blocos (hex).</div>`; return; }
  const full = CH[INVTAB];
  const bag = INVTAB === 'extra' ? CH.extra : CH.backpack;
  const counts = {}; full.forEach(it => { const t = itemType(it); counts[t] = (counts[t]||0)+1; });
  if(FILTER !== 'Todos' && !counts[FILTER]) FILTER = 'Todos';
  const list = FILTER === 'Todos' ? full : full.filter(it => itemType(it) === FILTER);
  const used = new Set(bag.map(i => i.slot));
  const maxSlot = Math.max(-1, ...bag.map(i => i.slot));
  let cells = list.map(it => slotCard(it)).join('');
  if(INVTAB !== 'equipment' && FILTER === 'Todos') cells += `<div class="slot empty" style="cursor:pointer" id="addBtn">＋ Adicionar item</div>`;
  const filters = ['Todos', ...Object.keys(counts).sort((a,b) => a.localeCompare(b))]
    .map(t => `<button class="tab ${FILTER===t?'active':''}" data-fl="${esc(t)}" style="${t!=='Todos'?'--c:'+typeColor(t):''}">${t!=='Todos'?typeIcon(t)+' ':''}${esc(t)} <span style="color:var(--muted)">${t==='Todos'?full.length:counts[t]}</span></button>`).join('');
  v.innerHTML = `
    <div class="banner info">💡 <div>Clique num item para mudar a <b>quantidade</b>, o <b>nível</b> ou a <b>durabilidade</b>, ou para <b>trocar</b> por outro item do jogo. Use <b>＋ Adicionar item</b> para buscar qualquer item do jogo e colocar na mochila. Os nomes vêm dos arquivos do próprio jogo, em português, e as imagens vêm da wiki.</div></div>
    <div class="tabs">
      <button class="tab ${INVTAB==='backpack'?'active':''}" data-t="backpack">🎒 Mochila (${CH.backpack.length})</button>
      <button class="tab ${INVTAB==='extra'?'active':''}" data-t="extra" title="Linhas a mais liberadas pela bolsa equipada">➕ Linhas extras da bolsa (${CH.extra.length})</button>
      <button class="tab ${INVTAB==='equipment'?'active':''}" data-t="equipment">🛡️ Equipado / barra (${CH.equipment.length})</button>
    </div>
    <div class="filters">${filters}</div>
    <div class="inv">${cells}</div>`;
  v.querySelectorAll('.tab[data-t]').forEach(b => b.onclick = () => { INVTAB = b.dataset.t; FILTER = 'Todos'; renderInv(v); });
  v.querySelectorAll('.tab[data-fl]').forEach(b => b.onclick = () => { FILTER = b.dataset.fl; renderInv(v); });
  v.querySelectorAll('.slot[data-s]').forEach(el => el.onclick = () => itemDrawer(INVTAB, +el.dataset.s));
  const ab = $('#addBtn'); if(ab) ab.onclick = () => addDrawer(INVTAB, used, maxSlot);
}
function slotCard(it){
  const dur = it.dur_max ? `<div class="bar" title="Durabilidade ${it.dur_cur}/${it.dur_max}"><i style="width:${Math.min(100,100*it.dur_cur/it.dur_max)}%"></i></div>` : '';
  const d = dbOf(it.hash), t = itemType(it), img = imgName(it.hash);
  return `<div class="slot" data-s="${it.slot}" style="--c:${typeColor(t)}" title="${esc(d ? d.desc : it.hash)}">
    <span class="n">#${it.slot}</span>
    ${img ? `<img class="pic" src="${imgUrl(img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    <div class="nm">${esc(itemName(it.hash))}</div>
    <div class="chips">${t !== 'Sem nome' ? typeChip(t, d && d.sub) : `<span class="id">${it.hash}</span>`}${d ? rarityChip(d.rarity) : ''}${it.level!=null?`<span class="tag">Nv ${it.level}</span>`:''}</div>
    <div class="qty">×${it.count}</div>${dur}
  </div>`;
}

/* busca no banco de itens do jogo */
function itemSearchBox(id, placeholder){
  const kinds = Object.keys(TYPES).filter(t => !['Desconhecido','Sem nome'].includes(t));
  return `<div class="row">
      <input class="in" id="${id}Q" placeholder="${placeholder || 'Buscar item (português ou inglês)…'}" style="flex:3">
      <select class="in" id="${id}T" style="flex:1"><option value="">Todos os tipos</option>${kinds.map(t => `<option value="${t}">${typeIcon(t)} ${t}</option>`).join('')}</select>
    </div>
    <div id="${id}R" class="wgrid" style="margin-top:10px"><p class="hint">Digite parte do nome ou escolha um tipo.</p></div>`;
}
function bindItemSearch(id, onPick){
  let timer, seq = 0;
  const run = async () => {
    const q = $('#'+id+'Q').value.trim(), t = $('#'+id+'T').value, my = ++seq;
    if(!q && !t){ $('#'+id+'R').innerHTML = '<p class="hint">Digite parte do nome ou escolha um tipo.</p>'; return; }
    let r; try{ r = await call('/api/items/search', {q, type:t}); }catch(e){ $('#'+id+'R').innerHTML = `<p class="hint" style="color:var(--bad)">${esc(e.message)}</p>`; return; }
    if(my !== seq) return;
    r.items.forEach(i => DBX[i.hash] = i);
    $('#'+id+'R').innerHTML = r.items.length ? r.items.map(i => `<div class="witem" data-h="${i.hash}" title="${esc(i.en)} · ${i.hash}">
        <img src="${imgUrl(i.en)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span>${esc(i.pt)}</span>
        ${typeChip(i.type, i.sub)}${rarityChip(i.rarity)}</div>`).join('') : '<p class="hint">Nada encontrado.</p>';
    $('#'+id+'R').querySelectorAll('.witem').forEach(el => el.onclick = () => {
      $('#'+id+'R').querySelectorAll('.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); onPick(DBX[el.dataset.h]);
    });
  };
  $('#'+id+'Q').oninput = () => { clearTimeout(timer); timer = setTimeout(run, 250); };
  $('#'+id+'T').onchange = run;
}

function openDrawer(html){ $('#drawer').innerHTML = html; $('#drawer').classList.add('open'); $('#drawerBg').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawerBg').classList.remove('open'); }
$('#drawerBg').onclick = closeDrawer;

function itemHeader(h){
  const d = dbOf(h), img = imgName(h);
  return `<div class="preview"><img src="${img?imgUrl(img):''}" alt="" style="${img?'':'visibility:hidden'}" onerror="this.style.visibility='hidden'">
      <div style="flex:1;min-width:0"><h3>${esc(itemName(h))}</h3>
        <div class="chips" style="margin-top:4px">${d ? typeChip(d.type, d.sub) + rarityChip(d.rarity) : '<span class="hint">Item sem dados no banco</span>'}<span class="id">${h}</span></div></div></div>
    ${d ? `<div class="info">
      ${d.en?`<span>Em inglês</span><span>${esc(d.en)}</span>`:''}
      <span>Pilha máx.</span><span>${d.stack}</span>
      ${d.desc?`<span>Descrição</span><span>${esc(d.desc)}</span>`:''}
      <span id="wikiFx" style="display:contents"></span>
    </div>` : ''}`;
}
async function fillWikiFx(h){
  const d = dbOf(h); if(!d || !d.en) return;
  await loadInfo([d.en]); const i = INFO[d.en], el = $('#wikiFx'); if(!el || !i || !i.found) return;
  el.innerHTML = `${i.effects && i.effects.length?`<span>Efeitos</span><span>${i.effects.map(esc).join('<br>')}${i.duration?' <span style="color:var(--muted)">('+esc(i.duration)+')</span>':''}</span>`:''}
    <span>Wiki</span><span><a href="https://enshrouded.wiki.gg/wiki/${encodeURIComponent(i.title.replace(/ /g,'_'))}" target="_blank" rel="noopener" style="color:var(--accent)">abrir página ↗</a></span>`;
}
function itemDrawer(where, slot){
  const it = CH[where].find(i => i.slot===slot);
  openDrawer(`<div id="iHead">${itemHeader(it.hash)}</div>
    <div class="row">
      <label class="f">Quantidade<input class="in" id="iCount" type="number" min="1" max="65535" value="${it.count}"></label>
      ${it.level!=null?`<label class="f">Nível do item <span id="iLvlHint"></span><input class="in" id="iLevel" type="number" min="0" max="255" value="${it.level}"></label>`:''}
    </div>
    ${it.dur_max!=null?`<div class="row">
      <label class="f">Durabilidade atual<input class="in" id="iDc" type="number" min="0" value="${it.dur_cur}"></label>
      <label class="f">Durabilidade máx.<input class="in" id="iDm" type="number" min="0" value="${it.dur_max}"></label></div>`:''}
    <div class="row"><button class="btn sm" id="iMax">Pilha cheia</button><button class="btn sm" id="iFix">Reparar</button>${it.level!=null?'<button class="btn sm" id="iLvlMax">⬆ Nível máximo</button>':''}</div>
    <div class="row" style="margin-top:4px">
      <button class="btn primary" id="iSave">Aplicar</button>
      ${where!=='equipment'?'<button class="btn danger" id="iDel">Remover</button>':''}
    </div>
    <div class="card" style="padding:14px">
      <h2 style="margin-bottom:8px">🔁 Trocar por outro item</h2>
      ${itemSearchBox('sw')}
      <label class="f" style="margin-top:10px">ID do item (hex)<input class="in mono" id="iHash" value="${it.hash}"></label>
      <p class="hint">Troque por um item do mesmo tipo (arma por arma, material por material). O nível e a durabilidade continuam os do item atual.</p>
    </div>`);
  fillWikiFx(it.hash);
  // limita o nivel a faixa do equipamento (itemLevelRange do jogo)
  const lvlInput = $('#iLevel');
  const applyRange = (h, clamp) => {
    if(!lvlInput) return;
    const d = dbOf(h), r = d && d.lvl;
    lvlInput.min = r ? r[0] : 0; lvlInput.max = r ? r[1] : 255;
    $('#iLvlHint').innerHTML = r ? `<span class="tag">${r[0] === r[1] ? 'fixo em ' + r[0] : r[0] + '–' + r[1]}</span>` : '';
    if(clamp && r) lvlInput.value = Math.min(Math.max(+lvlInput.value, r[0]), r[1]);
  };
  applyRange(it.hash, false);
  if(lvlInput){
    lvlInput.onchange = () => { const r = (dbOf($('#iHash').value.trim().toLowerCase())||{}).lvl; if(r && (+lvlInput.value < r[0] || +lvlInput.value > r[1])){ lvlInput.value = Math.min(Math.max(+lvlInput.value, r[0]), r[1]); toast(`Este item vai do nível ${r[0]} ao ${r[1]}`, 'err'); } };
    $('#iLvlMax').onclick = () => { const r = (dbOf($('#iHash').value.trim().toLowerCase())||{}).lvl; if(r) lvlInput.value = r[1]; else toast('Sem faixa de nível conhecida para este item', 'err'); };
  }
  bindItemSearch('sw', i => { $('#iHash').value = i.hash; $('#iHead').innerHTML = itemHeader(i.hash); fillWikiFx(i.hash); applyRange(i.hash, true); });
  $('#iSave').onclick = async () => {
    const g = id => { const e = document.getElementById(id); return e ? e.value : undefined; };
    const r = await act(() => call('/api/item/update', {where, slot, hash:g('iHash'), count:g('iCount'), level:g('iLevel'), dur_cur:g('iDc'), dur_max:g('iDm')}));
    if(r){ closeDrawer(); toast('Item atualizado. Clique em "Salvar no jogo".'); }
  };
  $('#iMax').onclick = () => { const d = dbOf($('#iHash').value.trim().toLowerCase()); $('#iCount').value = (d && d.stack) || 999; };
  $('#iFix').onclick = () => { const dm=$('#iDm'), dc=$('#iDc'); if(dm) dc.value = dm.value; else toast('Este item não tem durabilidade','err'); };
  const del = $('#iDel'); if(del) del.onclick = async () => { if(!confirm('Remover este item da mochila?')) return; const r = await act(() => call('/api/item/delete', {where, slot})); if(r){ closeDrawer(); toast('Item removido'); } };
}
function addDrawer(where, used, maxSlot){
  let free = []; for(let s=0; s<=Math.max(maxSlot+4, 40) && free.length<12; s++) if(!used.has(s)) free.push(s);
  const all = [...CH.backpack.map(i=>['backpack',i]), ...CH.extra.map(i=>['extra',i]), ...CH.equipment.map(i=>['equipment',i])];
  let picked = null;
  openDrawer(`<h3>＋ Adicionar item</h3>
    ${itemSearchBox('ad', 'Ex.: adaga, poção, ferro, Torn Cloth…')}
    <div id="aPick"></div>
    <div class="row">
      <label class="f">Slot ${where==='extra'?'nas linhas extras':'na mochila'}<select class="in" id="aSlot">${free.map(s => `<option value="${s}">#${s}${s>maxSlot?' (além do último usado)':''}</option>`).join('')}</select></label>
      <label class="f">Quantidade<input class="in" id="aCount" type="number" min="1" max="65535" value="1"></label>
    </div>
    <details><summary class="hint" style="cursor:pointer">Avançado: escolher o item-modelo</summary>
      <label class="f" style="margin-top:8px">Copiar formato de<select class="in" id="aTpl"><option value="">Automático (recomendado)</option>${all.map(([w,i]) => `<option value="${w}:${i.slot}">${{backpack:'🎒', extra:'➕', equipment:'🛡️'}[w]} #${i.slot} — ${esc(itemName(i.hash))}</option>`).join('')}</select></label>
      <p class="hint">O item novo copia o formato (nível, durabilidade) de um item parecido que você já tem. Armas e armaduras precisam de um modelo do mesmo tipo.</p>
    </details>
    <div class="banner warn" style="margin:0">⚠️ <div>Se o slot passar da capacidade atual da mochila, o jogo pode descartar o item. Prefira os primeiros slots livres.</div></div>
    <button class="btn primary" id="aGo" disabled>Adicionar</button>`);
  bindItemSearch('ad', i => {
    picked = i; $('#aGo').disabled = false;
    const lv = (DBX[i.hash] || {}).lvl;
    $('#aPick').innerHTML = `<div class="info"><span>Escolhido</span><span><b>${esc(i.pt)}</b> ${typeChip(i.type, i.sub)} ${rarityChip(i.rarity)}</span><span>Pilha máx.</span><span>${i.stack}</span>${lv ? `<span>Nível</span><span>${lv[0] === lv[1] ? 'fixo em ' + lv[0] : lv[0] + ' a ' + lv[1] + ' (ajustado automaticamente)'}</span>` : ''}</div>`;
    $('#aCount').max = i.stack;
    $('#aCount').value = Math.min(+$('#aCount').value || 1, i.stack) || 1;
  });
  $('#aGo').onclick = async () => {
    if(!picked) return;
    const tpl = $('#aTpl').value;
    const body = {where, slot:+$('#aSlot').value, count:$('#aCount').value, hash:picked.hash};
    if(tpl){ const [w,s] = tpl.split(':'); body.template = [w,+s]; }
    const r = await act(() => call('/api/item/add', body));
    if(r){ closeDrawer(); toast(picked.pt + ' adicionado. Clique em "Salvar no jogo".'); }
  };
}

/* ---------- Scanner ---------- */
function renderScan(v){
  v.innerHTML = `
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:16px">
    <div class="card">
      <h2>🔎 Procurar valor</h2>
      <div class="row">
        <label class="f">Valor<input class="in" id="sVal" type="number" step="any" placeholder="ex.: 14"></label>
        <label class="f">Tipo<select class="in" id="sType">
          <option value="u8">Byte (0–255)</option><option value="u16">Inteiro 16 bits</option><option value="u32" selected>Inteiro 32 bits</option><option value="f32">Decimal (float)</option></select></label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="sNew">Novo scan</button>
        <button class="btn" id="sNext" ${SCAN?'':'disabled'}>Próximo scan (relê o disco)</button>
      </div>
      <p class="hint">O próximo scan relê o arquivo do disco e descarta alterações que ainda não foram salvas.</p>
    </div>
    <div class="card">
      <h2>🧭 Como achar os pontos de talento</h2>
      <ol class="steps">
        <li>No jogo, veja quantos pontos livres você tem (ex.: <b>14</b>). Saia para o menu principal.</li>
        <li>Aqui: <b>Recarregar</b>, digite 14, escolha <b>Byte</b> e clique em <b>Novo scan</b>.</li>
        <li>Volte ao jogo, gaste 1 ponto, saia para o menu.</li>
        <li>Digite <b>13</b> e clique em <b>Próximo scan</b>. Repita até sobrar 1 ou 2 resultados.</li>
        <li>Feche o jogo, mude o valor do resultado e clique em <b>Salvar no jogo</b>.</li>
      </ol>
    </div>
  </div>
  <div class="card" id="sRes">${scanTable()}</div>`;
  $('#sNew').onclick = async () => { if(!$('#sVal').value) return toast('Digite um valor','err'); const r = await act(() => call('/api/scan/new', {type:$('#sType').value, value:$('#sVal').value})); if(r){ SCAN=r; renderScan(v); } };
  $('#sNext').onclick = async () => { if(!$('#sVal').value) return toast('Digite o novo valor','err'); const r = await act(() => call('/api/scan/next', {value:$('#sVal').value})); if(r){ SCAN=r; renderScan(v); } };
  v.querySelectorAll('[data-set]').forEach(b => b.onclick = async () => {
    const [blk, off] = b.dataset.set.split('|'); const nv = prompt('Novo valor para '+blk+' @'+off+':'); if(nv===null) return;
    const r = await act(() => call('/api/scan/set', {block:blk, offset:+off, value:nv})); if(r) toast('Valor alterado. Clique em "Salvar no jogo".');
  });
  v.querySelectorAll('[data-hex]').forEach(b => b.onclick = () => { const [blk,off] = b.dataset.hex.split('|'); HEX={block:blk, offset:Math.max(0,(+off & ~15)-64), sel:+off}; go('hex'); });
}
function scanTable(){
  if(!SCAN) return '<p class="hint">Nenhum scan ainda.</p>';
  if(!SCAN.total) return '<p class="hint">Nenhum resultado. Confira o valor e o tipo.</p>';
  return `<h2>Resultados <span class="tag">${SCAN.total}${SCAN.total>SCAN.hits.length?' (mostrando '+SCAN.hits.length+')':''}</span></h2>
  <div style="overflow:auto"><table><tr><th>Bloco</th><th>Offset</th><th>Valor</th><th>Contexto</th><th></th></tr>
  ${SCAN.hits.map(h => `<tr><td>${esc(h.block)}</td><td class="mono">0x${h.offset.toString(16)}</td><td><b>${h.value}</b></td>
  <td class="mono" style="font-size:11px;color:var(--muted)">${h.context.match(/../g).join(' ')}</td>
  <td style="white-space:nowrap"><button class="btn sm" data-set="${esc(h.block)}|${h.offset}">Mudar</button> <button class="btn sm" data-hex="${esc(h.block)}|${h.offset}">Hex</button></td></tr>`).join('')}</table></div>`;
}

/* ---------- Hex ---------- */
async function renderHex(v){
  const blocks = ST.info.blocks;
  if(!HEX.block) HEX.block = (blocks.find(b=>b.name==='player_character')||blocks[0]).name;
  const page = 512;
  let r; try{ r = await call('/api/block', {name:HEX.block, offset:HEX.offset, length:page}); }catch(e){ v.innerHTML=`<div class="banner bad">${esc(e.message)}</div>`; return; }
  const bytes = r.hex.match(/../g) || [];
  let rows = '';
  for(let i=0;i<bytes.length;i+=16){
    const off = r.offset+i, chunk = bytes.slice(i,i+16);
    rows += `<div><span class="ln">${off.toString(16).padStart(6,'0')}</span>${chunk.map((b,j)=>`<span class="b ${b==='00'?'z':''} ${HEX.sel===off+j?'sel':''}" data-o="${off+j}">${b}</span>`).join(' ')}<span class="ascii">${esc(chunk.map(b=>{const c=parseInt(b,16);return c>31&&c<127?String.fromCharCode(c):'·'}).join(''))}</span></div>`;
  }
  v.innerHTML = `
  <div class="card" style="margin-bottom:16px">
    <h2>🧬 Blocos deste arquivo</h2>
    <div style="overflow:auto"><table><tr><th>Bloco</th><th>Tipo</th><th>Tamanho</th><th>Compactado</th><th></th></tr>
    ${blocks.map(b=>`<tr><td>${esc(b.name)} ${b.dirty?'<span class="tag" style="color:var(--warn)">editado</span>':''}</td><td>${b.type}</td><td>${fmtSize(b.size)}</td><td>${b.compressed?'zstd':'não'}</td><td><button class="btn sm" data-b="${esc(b.name)}">Abrir</button></td></tr>`).join('')}</table></div>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:12px;align-items:center">
      <div style="flex:3"><b>${esc(r.name)}</b> <span class="hint">${r.size.toLocaleString('pt-BR')} bytes · offset 0x${r.offset.toString(16)}</span></div>
      <button class="btn sm" id="hPrev" style="flex:0">◀</button>
      <input class="in mono" id="hGo" placeholder="ir p/ offset (hex)" style="flex:1">
      <button class="btn sm" id="hNext" style="flex:0">▶</button>
    </div>
    <div class="hex">${rows}</div>
    <div class="row" style="margin-top:12px">
      <label class="f" style="flex:1">Offset selecionado<input class="in mono" id="hOff" value="${HEX.sel!=null?'0x'+HEX.sel.toString(16):''}" placeholder="clique num byte"></label>
      <label class="f" style="flex:2">Novos bytes (hex, sobrescreve)<input class="in mono" id="hBytes" placeholder="ex.: 0e 00"></label>
      <button class="btn primary" id="hWrite" style="flex:0">Gravar</button>
    </div>
    <p class="hint">Mudanças no hex sobrescrevem bytes sem mudar o tamanho do bloco. O app recompacta e recalcula os hashes ao salvar.</p>
  </div>`;
  v.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { HEX={block:b.dataset.b, offset:0, sel:null}; renderHex(v); });
  v.querySelectorAll('.hex .b').forEach(b => b.onclick = () => { HEX.sel = +b.dataset.o; v.querySelectorAll('.hex .sel').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); $('#hOff').value='0x'+HEX.sel.toString(16); $('#hBytes').value=b.textContent; $('#hBytes').focus(); });
  $('#hPrev').onclick = () => { HEX.offset = Math.max(0, HEX.offset-page); renderHex(v); };
  $('#hNext').onclick = () => { if(HEX.offset+page < r.size){ HEX.offset += page; renderHex(v);} };
  $('#hGo').onkeydown = e => { if(e.key==='Enter'){ const o=parseInt($('#hGo').value.replace(/^0x/,''),16); if(!isNaN(o)){ HEX.offset=Math.max(0,(o&~15)); HEX.sel=o; renderHex(v);} } };
  $('#hWrite').onclick = async () => {
    const off = parseInt($('#hOff').value.replace(/^0x/,''),16), hx = $('#hBytes').value.replace(/[^0-9a-fA-F]/g,'');
    if(isNaN(off) || !hx || hx.length%2) return toast('Offset ou bytes inválidos','err');
    const ok = await act(() => call('/api/block/write', {name:HEX.block, offset:off, hex:hx}));
    if(ok) toast('Bytes gravados na memória. Clique em "Salvar no jogo".');
  };
}

/* ---------- Backups ---------- */
async function renderBak(v){
  const r = await call('/api/backups');
  v.innerHTML = `
  <div class="banner info">🛟 <div>Antes de cada salvamento o app copia <b>todos</b> os seus saves para a pasta <span class="mono">backups</span> do editor. Restaurar também faz um backup do estado atual antes.</div></div>
  <div class="card">
    <div class="row" style="margin-bottom:12px;align-items:center"><h2 style="margin:0;flex:3">Backups do editor</h2><button class="btn" id="bNew" style="flex:0;white-space:nowrap">＋ Backup agora</button></div>
    ${r.backups.length ? `<table><tr><th>Data</th><th>Motivo</th><th>Arquivos</th><th></th></tr>
    ${r.backups.map(b=>`<tr><td class="mono">${esc(b.id.replace('_',' ').replace(/-(\d\d)-(\d\d)$/,':$1:$2'))}</td><td>${esc(b.reason)}</td><td style="color:var(--muted)">${b.files.length}</td><td><button class="btn sm" data-r="${esc(b.id)}">Restaurar</button></td></tr>`).join('')}</table>`
    : '<p class="hint">Nenhum backup ainda. Faça um agora antes de começar!</p>'}
  </div>`;
  $('#bNew').onclick = async () => { const x = await act(() => call('/api/backup/create', {reason:'Backup manual'})); if(x) toast('Backup criado'); };
  v.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => { if(!confirm('Restaurar este backup? Os saves atuais serão substituídos (um backup deles será feito antes).')) return; const x = await act(() => call('/api/backup/restore', {id:b.dataset.r})); if(x) toast('Backup restaurado'); });
}

/* ---------- Minimapa (shroudtopia.json; o mod aplica na hora) ---------- */
const MAP_SHOW = [
  ['show_world_markers', 'Locais do mapa', 'Pontos de interesse, altares, NPCs e os marcadores que você colocou'],
  ['show_waypoints', 'Destino marcado', 'Contorno amarelo do ponto que você escolheu no mapa'],
  ['show_other_players', 'Outros jogadores', 'Setas verdes dos seus amigos'],
  ['show_pings', 'Pings', 'Losangos verdes quando alguém marca um lugar'],
  ['show_death_markers', 'Túmulos', 'Caveiras onde você ou amigos morreram'],
  ['show_fog_of_war', 'Esconder áreas não exploradas', 'Cobre com névoa o que você ainda não descobriu'],
  ['show_clock', 'Relógio do jogo', 'Hora do mundo embaixo do mapa (sol de dia, lua de noite)'],
  ['show_weather', 'Clima', 'Tempo atual ao lado do relógio'],
];
const MAP_SELECTS = {
  position: [['bottom-right','Embaixo à direita'],['middle-right','No meio à direita'],['top-right','Em cima à direita'],['bottom-left','Embaixo à esquerda'],['middle-left','No meio à esquerda'],['top-left','Em cima à esquerda']],
  scale_percent: [50,75,100,125,150,175,200].map(n => [n, n + '%']),
  map_orientation: [['north-up','Norte sempre para cima'],['rotating','Gira junto com o personagem']],
  map_style: [['default','Colorido (HD)'],['original','Cores originais do jogo']],
  icon_style: [['original','Ícones originais'],['world-map','Ícones com moldura dourada']],
  map_sample_step: [[1,'Alta (mais nítido)'],[2,'Padrão do mod'],[3,'Baixa (mais leve)']],
};
const MAP_KEYS = [
  ['toggle_key','Mostrar / esconder'], ['toggle_key_secondary','Mostrar / esconder (2ª tecla)'],
  ['zoom_in_key','Aproximar'], ['zoom_in_key_secondary','Aproximar (2ª tecla)'],
  ['zoom_out_key','Afastar'], ['zoom_out_key_secondary','Afastar (2ª tecla)'],
  ['size_decrease_key','Diminuir o minimapa'], ['size_increase_key','Aumentar o minimapa'],
];
// e.code do navegador -> código de tecla do Windows que o mod entende
const VK = (() => {
  const m = {Equal:0xBB, Minus:0xBD, Comma:0xBC, Period:0xBE, Slash:0xBF, Backquote:0xC0, BracketLeft:0xDB, Backslash:0xDC,
    BracketRight:0xDD, Quote:0xDE, Semicolon:0xBA, IntlBackslash:0xE2, IntlRo:0xC1, NumpadMultiply:0x6A, NumpadAdd:0x6B,
    NumpadSubtract:0x6D, NumpadDecimal:0x6E, NumpadDivide:0x6F, NumpadComma:0xC2, Insert:0x2D, Delete:0x2E, Home:0x24, End:0x23,
    PageUp:0x21, PageDown:0x22, Space:0x20, Tab:0x09, ArrowLeft:0x25, ArrowUp:0x26, ArrowRight:0x27, ArrowDown:0x28};
  for(let i=0;i<26;i++) m['Key'+String.fromCharCode(65+i)] = 65+i;
  for(let i=0;i<10;i++){ m['Digit'+i] = 0x30+i; m['Numpad'+i] = 0x60+i; }
  return m;
})();
const VK_NAMES = {0xBB:'+ (teclado)', 0xBD:'- (teclado)', 0x6A:'* (numérico)', 0x6B:'+ (numérico)', 0x6D:'- (numérico)', 0x6F:'/ (numérico)',
  0x2D:'Insert', 0x2E:'Delete', 0x24:'Home', 0x23:'End', 0x21:'Page Up', 0x22:'Page Down', 0x20:'Espaço', 0x09:'Tab',
  0x25:'←', 0x26:'↑', 0x27:'→', 0x28:'↓', 0xC1:'/ (ABNT)', 0xC2:'. (numérico ABNT)'};
function keyLabel(v){
  if(!v || v === 'none') return 'nenhuma';
  if(/^F\d+$/.test(v)) return v;
  const n = parseInt(v, 16);
  if(VK_NAMES[n]) return VK_NAMES[n];
  if(n >= 0x41 && n <= 0x5A) return String.fromCharCode(n);
  if(n >= 0x30 && n <= 0x39) return String.fromCharCode(n);
  if(n >= 0x60 && n <= 0x69) return (n - 0x60) + ' (numérico)';
  return v;
}
function codeToKey(e){
  if(/^F([1-9]|1\d|2[0-4])$/.test(e.code)) return e.code;
  const n = VK[e.code];
  return n === undefined ? null : '0x' + n.toString(16).toUpperCase().padStart(2, '0');
}

async function renderMap(v){
  let M;
  try{ M = await call('/api/minimap'); }catch(e){ v.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; return; }
  if(!M.installed){
    v.innerHTML = `<div class="banner warn">🧭 <div>O minimapa não está instalado${M.game_dir ? ` em <span class="mono">${esc(M.game_dir)}</span>` : ' (não achei a pasta do Enshrouded)'}. Use o <b>Instalador Minimap Enshrouded</b> primeiro.</div></div>`;
    return;
  }
  const V = M.values;
  const sw = (k) => `<label class="sw"><input type="checkbox" data-k="${k}" ${V[k] ? 'checked' : ''}><i></i></label>`;
  const sel = (k) => `<select class="in" data-k="${k}" data-num="${typeof MAP_SELECTS[k][0][0] === 'number' ? 1 : ''}">${MAP_SELECTS[k].map(([val, t]) => `<option value="${val}" ${String(V[k]) === String(val) ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const range = (k, lo, hi, step, unit) => `<input type="range" data-k="${k}" min="${lo}" max="${hi}" step="${step}" value="${V[k]}"><span class="val" data-for="${k}">${V[k]}${unit}</span>`;
  const opt = (title, hint, ctl) => `<div class="opt"><div class="tx"><b>${title}</b>${hint ? `<span>${hint}</span>` : ''}</div>${ctl}</div>`;
  const vis = M.visual;

  v.innerHTML = `
  <div class="banner info">⚡ <div>As mudanças valem <b>na hora</b>, mesmo com o jogo aberto. Só o <b>Visual</b> (moldura e seta) precisa reiniciar o jogo.</div></div>
  <div class="card" style="margin-bottom:16px">
    ${opt('Minimapa ligado', 'Desligado, ele não aparece de jeito nenhum. Para esconder só por um tempo, use a tecla ' + esc(keyLabel(V.toggle_key)) + ' no jogo.', sw('active'))}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr));align-items:start">
    <div class="card"><h2>👁️ O que aparece</h2>
      <div class="opts" data-dep>
        ${MAP_SHOW.map(([k, t, h]) => opt(t, h, sw(k))).join('')}
        ${opt('Máximo de ícones', 'Menos ícones deixa o mapa mais limpo', range('max_icons', 8, 128, 8, ''))}
        ${opt('Destacar locais já concluídos', 'Ainda não dá: o mod não sabe quais locais você já concluiu', '<span class="chip">indisponível</span>')}
      </div>
    </div>
    <div class="card"><h2>🎨 Aparência</h2>
      <div class="opts" data-dep>
        ${opt('Visual', vis === 'outro' ? 'Visual personalizado instalado' : 'Moldura e seta. Vale ao reiniciar o jogo', `<div class="seg">${['moderno','original'].map(k => `<button data-vis="${k}" class="${vis===k?'on':''}" ${M.visual_available[k] ? '' : 'disabled'}>${k === 'moderno' ? 'Moderno' : 'Original'}</button>`).join('')}</div>`)}
        ${opt('Posição na tela', '', sel('position'))}
        ${opt('Ajuste de altura', 'Sobe (+) ou desce (−) o minimapa, em pixels de 1080p', range('offset', -300, 300, 10, ' px'))}
        ${opt('Tamanho', 'Também dá para mudar no jogo com ' + esc(keyLabel(V.size_decrease_key)) + ' / ' + esc(keyLabel(V.size_increase_key)), sel('scale_percent'))}
        ${opt('Orientação', '', sel('map_orientation'))}
        ${opt('Cores do mapa', '', sel('map_style'))}
        ${opt('Estilo dos ícones', '', sel('icon_style'))}
        ${opt('Brilho do terreno', '0 = escuro como no mod original', range('map_light', 0, 100, 5, ''))}
        ${opt('Nitidez do terreno', '', sel('map_sample_step'))}
        ${opt('Suavizar a rotação', 'Quanto maior, mais suave (e mais atrasada) a seta gira', range('heading_smoothing_ms', 0, 250, 5, ' ms'))}
      </div>
    </div>
    <div class="card"><h2>⌨️ Teclas</h2>
      <div class="opts" data-dep>
        ${MAP_KEYS.map(([k, t]) => opt(t, '', `<button class="btn sm keybtn" data-key="${k}">${esc(keyLabel(V[k]))}</button><button class="btn sm" data-clear="${k}" title="Sem tecla">✕</button>`)).join('')}
      </div>
      <p class="hint" style="margin-top:10px">Clique no botão e aperte a tecla. <b>Esc</b> cancela.</p>
    </div>
  </div>
  <div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn" id="mapReset">↺ Voltar tudo ao padrão do mod</button></div>`;

  const setDep = () => v.querySelectorAll('[data-dep]').forEach(el => el.classList.toggle('off', !V.active));
  setDep();
  async function apply(k, val, label){
    try{
      await call('/api/minimap/save', {values: {[k]: val}});
      V[k] = val;
      toast('✔ ' + (label || 'Aplicado') + ' — já vale no jogo');
    }catch(e){ toast(e.message, 'err'); renderMap(v); }
  }
  v.querySelectorAll('input[type=checkbox][data-k]').forEach(el => el.onchange = async () => { await apply(el.dataset.k, el.checked, el.checked ? 'Ligado' : 'Desligado'); setDep(); });
  v.querySelectorAll('select[data-k]').forEach(el => el.onchange = () => apply(el.dataset.k, el.dataset.num ? +el.value : el.value));
  v.querySelectorAll('input[type=range][data-k]').forEach(el => {
    const out = v.querySelector(`[data-for="${el.dataset.k}"]`), unit = out.textContent.replace(/^-?\d+/, '');
    el.oninput = () => out.textContent = el.value + unit;
    el.onchange = () => apply(el.dataset.k, +el.value);
  });
  v.querySelectorAll('[data-vis]').forEach(b => b.onclick = async () => {
    try{
      const r = await call('/api/minimap/visual', {kind: b.dataset.vis});
      toast('Visual ' + b.textContent + ' instalado' + (r.running ? '. Reinicie o jogo para ver.' : '. Aparece quando abrir o jogo.'));
      renderMap(v);
    }catch(e){ toast(e.message, 'err'); }
  });
  v.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => apply(b.dataset.clear, 'none', 'Tecla removida').then(() => renderMap(v)));
  v.querySelectorAll('[data-key]').forEach(b => b.onclick = () => {
    v.querySelectorAll('.keybtn.wait').forEach(x => { x.classList.remove('wait'); x.textContent = keyLabel(V[x.dataset.key]); });
    b.classList.add('wait'); b.textContent = 'aperte uma tecla…';
    const onKey = async e => {
      e.preventDefault(); e.stopPropagation();
      document.removeEventListener('keydown', onKey, true);
      b.classList.remove('wait');
      if(e.code === 'Escape'){ b.textContent = keyLabel(V[b.dataset.key]); return; }
      const key = codeToKey(e);
      if(!key){ b.textContent = keyLabel(V[b.dataset.key]); toast('Essa tecla não pode ser usada', 'err'); return; }
      await apply(b.dataset.key, key, 'Tecla ' + keyLabel(key));
      b.textContent = keyLabel(V[b.dataset.key]);
    };
    document.addEventListener('keydown', onKey, true);
  });
  $('#mapReset').onclick = async () => {
    if(!confirm('Voltar todas as opções do minimapa ao padrão do mod? (posição, teclas, o que aparece…)')) return;
    const d = {...M.defaults}; delete d.render_camera_fallback; delete d.debug_logging; d.active = true;
    try{ await call('/api/minimap/save', {values: d}); toast('Opções do minimapa restauradas'); renderMap(v); }catch(e){ toast(e.message, 'err'); }
  };
}

function go(v){ VIEW = v; refresh(); }
document.querySelectorAll('.nbtn').forEach(b => b.onclick = () => go(b.dataset.v));
$('#reloadBtn').onclick = async () => { if(!ST.open) return refresh(); if(ST.dirty && !confirm('Descartar alterações não salvas e recarregar do disco?')) return; await act(() => call('/api/reload', {})); toast('Recarregado do disco'); };
$('#saveBtn').onclick = async () => { const r = await act(() => call('/api/save', {})); if(r) toast('Salvo! Backup em backups/'+r.backup); };
window.addEventListener('beforeunload', e => { if(ST && ST.dirty){ e.preventDefault(); e.returnValue=''; } });
setInterval(async () => { try{ const s = await call('/api/state'); if(s.game_state!==ST.game_state || s.changed_on_disk!==ST.changed_on_disk) refresh(); }catch{} }, 5000);
refresh();
</script>
